<div class="flex min-h-dvh flex-col bg-base-200/60">
  <header class="sticky top-0 z-30 border-b border-base-300 bg-base-100">
    <div class="mx-auto flex h-14 max-w-6xl items-center gap-3 px-4 sm:gap-6 sm:px-6">
      <a routerLink="/" class="flex items-center gap-2 font-mono text-sm font-semibold tracking-tight">
        <span class="size-2 rounded-full bg-primary"></span>roster
      </a>

      @if (sesi.id()) {
        <nav class="flex h-full items-stretch gap-0 text-sm sm:gap-1" aria-label="Menu utama">
          <a routerLink="/minggu" routerLinkActive="text-primary shadow-[inset_0_-2px_currentColor]" class="flex items-center whitespace-nowrap px-2.5 text-base-content/60 transition hover:text-base-content">Jadwal</a>
          <a routerLink="/tukar" routerLinkActive="text-primary shadow-[inset_0_-2px_currentColor]" class="flex items-center whitespace-nowrap px-2.5 text-base-content/60 transition hover:text-base-content">Tukar shift</a>
        </nav>
      }

      <div class="ml-auto flex items-center gap-2">
        @if (sesi.pengguna(); as p) {
          <div class="mr-1 hidden items-center gap-2.5 sm:flex">
            <span class="grid size-7 place-items-center rounded-full bg-base-300 text-[11px] font-semibold">{{ inisialPengguna() }}</span>
            <div class="leading-tight">
              <p class="text-sm font-medium">{{ p.nama }}</p>
              <p class="text-[11px] capitalize text-base-content/50">{{ p.peran }}</p>
            </div>
          </div>
        }

        <button type="button" class="btn btn-ghost btn-sm btn-square" (click)="gantiTema()" [attr.aria-label]="gelap() ? 'Pakai tema terang' : 'Pakai tema gelap'">
          @if (gelap()) {
            <svg class="size-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path stroke-linecap="round" d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M19.1 4.9l-1.4 1.4M4.9 19.1l1.4-1.4" />
            </svg>
          } @else {
            <svg class="size-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" />
            </svg>
          }
        </button>

        @if (sesi.id()) {
          <button type="button" class="btn btn-ghost btn-sm" (click)="keluar()">Keluar</button>
        }
      </div>
    </div>
  </header>

  <main class="mx-auto w-full max-w-6xl flex-1 px-4 py-8 sm:px-6 sm:py-10">
    <router-outlet />
  </main>

  @if (notif.pesan(); as p) {
    <div class="toast toast-end toast-bottom z-50" role="status" aria-live="polite">
      <div class="alert alert-soft py-2.5 text-sm shadow-lg" [class.alert-success]="p.jenis === 'sukses'" [class.alert-error]="p.jenis === 'galat'">
        <span>{{ p.teks }}</span>
      </div>
    </div>
  }
</div>
